/* ---------- RICE DETAILS: tap any rice to see its stock, change the count, or act on it ---------- */
function priceOf(p){ const kg = priceKgOf(p); return {kg, sack: +p.priceSack || r2(kg * (+p.sackKg || 25))}; }
const pesoP = x => '₱' + (+x || 0).toLocaleString('en-PH', {minimumFractionDigits: (+x || 0) % 1 ? 2 : 0, maximumFractionDigits: 2});
function openRice(pid){
  const p = prod(pid); if (!p) return;
  const k = sackKgOf(pid);
  let touched = false;
  openModal(`<div class="rd-head"><div><h2>${esc(p.name)}</h2><p class="muted small">${nf(k)} kg sacks${supName(p.supplierId) ? ' · ' + esc(supName(p.supplierId)) : ''}</p></div><span id="rd-pill"></span></div>
    <div class="rd-tiles" id="rd-tiles"></div>
    <div class="rd-prices" id="rd-prices"></div>
    <form id="rd-f" class="rd-count form" novalidate>
      <h3>Change stock</h3>
      <div class="field"><span class="lbl">Location</span>${seg('rd-loc', locSegOpts, pref('count.loc', 'bodega'))}</div>
      <div class="field"><span class="lbl">What is really there</span>
        <div class="cinputs">${stepper('rd-sacks', 0)}<span class="muted">sacks +</span><input type="number" id="rd-kg" class="c-k" min="0" step="any" inputmode="decimal" value="0" aria-label="Loose kilograms"><span class="muted">kg</span></div>
        <button type="button" class="link-btn" id="rd-pile">Count by piles (e.g. 24 high × 5)</button></div>
      <div class="calc" id="rd-calc"></div>
      <div class="form-err" id="rd-err" role="alert"></div>
      <button class="btn primary block" id="rd-go" disabled>Save new count</button>
    </form>
    <div class="rd-actions">
      <button type="button" class="btn" data-rd="stock-in">${svg('stock-in')}Stock in</button>
      <button type="button" class="btn" data-rd="stock-out">${svg('stock-out')}Sell</button>
      <button type="button" class="btn" data-rd="transfer">${svg('transfer')}Transfer</button>
      <button type="button" class="btn" data-rd="edit">${svg('products')}Edit prices</button>
    </div>
    <div><h3 class="rd-h">Recent movements</h3><div id="rd-feed"></div></div>
    <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Close</button></div>`, m => {
    const f = $('#rd-f', m);
    const loc = () => segVal(f, 'rd-loc');
    const counted = () => r3(Math.max(0, Math.floor(+$('#rd-sacks', m).value || 0)) * k + Math.max(0, +$('#rd-kg', m).value || 0));
    const showCount = () => {
      const cur = bal(pid)[loc()], d = r3(counted() - cur);
      $('#rd-calc', m).innerHTML = Math.abs(d) < 0.0005
        ? `<span>${LOC[loc()]} has <b>${fmtStock(cur, k)}</b>. Change the numbers if the real count is different.</span>`
        : `<span>New count <b>${fmtStock(counted(), k)}</b></span><span>Difference <b class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmtStock(Math.abs(d), k)}</b></span>`;
      $('#rd-go', m).disabled = Math.abs(d) < 0.0005 || S.canWrite === false;
    };
    const preset = () => { const s = splitKg(bal(pid)[loc()], k); $('#rd-sacks', m).value = s.sacks; $('#rd-kg', m).value = s.kg; touched = false; showCount(); };
    const paint = () => {
      if (!document.body.contains(f)) { if (S.ui.riceRefresh === paint) S.ui.riceRefresh = null; return; }
      const pp = prod(pid); if (!pp) { closeModal(); return; }
      const b = bal(pid), pr = priceOf(pp);
      $('#rd-pill', m).innerHTML = isLow(pid) ? '<span class="pill low">LOW STOCK</span>' : '<span class="pill ok">OK</span>';
      $('#rd-tiles', m).innerHTML = [['bodega', 'Bodega'], ['stall', 'Stall'], ['total', 'Total']].map(([key, l]) =>
        `<div class="rd-tile ${key}"><span class="k-label"><i class="dot ${key}"></i>${l}</span><b class="num">${fmtStock(b[key], k)}</b><span class="small muted num">${nf(b[key])} kg</span></div>`).join('');
      $('#rd-prices', m).innerHTML = `<span>Sells for <b>${pesoP(pr.kg)}</b> a kilo · <b>${pesoP(pr.sack)}</b> a sack</span><span class="muted">Minimum: ${+pp.minSacks ? sacksTxt(+pp.minSacks) : 'not set'}</span>`;
      const rows = []; for (const t of S.txns) { if (t.productId !== pid) continue; rows.push(...rowsOf(t)); if (rows.length >= 6) break; }
      $('#rd-feed', m).innerHTML = rows.length ? `<div class="feed">${rows.slice(0, 6).map(feedRow).join('')}</div>` : '<p class="muted small">No movements yet.</p>';
      if (!touched) preset(); else showCount();
    };
    S.ui.riceRefresh = paint;
    f.addEventListener('input', () => { touched = true; showCount(); });
    f.addEventListener('change', e => { if (e.target.name === 'rd-loc') { setPref('count.loc', e.target.value); preset(); } });
    $('#rd-pile', m).addEventListener('click', () => openPileCounter(pid, (s, kg) => { $('#rd-sacks', m).value = s; $('#rd-kg', m).value = kg; touched = true; showCount(); }));
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#rd-err', m), btn = $('#rd-go', m); err.textContent = '';
      if (Math.abs(counted() - bal(pid)[loc()]) < 0.0005) return;
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await commit(pid, [{loc: loc(), setTo: counted()}], {type:'adjust', date: today(), reason:'Physical count', unit:'kg', sackKg: k, notes:'', staff: staffList().length ? pref('staff', staffList()[0]) : ''});
        toast(`${p.name} at ${LOC[loc()]} is now ${fmtStock(counted(), k)}`);
        touched = false; paint();
      } catch(e2){ err.textContent = e2 instanceof UserError ? e2.message : explainDbError(e2); }
      finally { btn.textContent = 'Save new count'; showCount(); }
    });
    m.addEventListener('click', e => {
      const a = e.target.closest('[data-rd]'); if (!a) return;
      const act = a.dataset.rd; closeModal();
      if (act === 'stock-in') { S.ui.pendingProd = pid; go('stock-in'); }
      else if (act === 'stock-out') { setPref('out.prod', pid); go('stock-out'); }
      else if (act === 'transfer') { setPref('tr.prod', pid); go('transfer'); }
      else if (act === 'edit') openProduct(pid);
    });
    paint();
  });
}

/* ---------- PRICE LIST ---------- */
function priceRows(showCost, clickable){
  const ps = activeProducts();
  if (!ps.length) return `<div class="panel"><div class="empty"><p>No rice varieties yet.</p></div></div>`;
  return `<div class="plist">${ps.map(p => {
    const k = sackKgOf(p.id), pr = priceOf(p), ck = costKgOf(p), cs = +p.costSack || r2(ck * k);
    const margin = pr.kg && ck ? (pr.kg - ck) / pr.kg * 100 : null;
    const upd = p.pricesUpdatedAt ? ' · updated ' + fmtDateShort(localDate(new Date(p.pricesUpdatedAt))) : '';
    return `<div class="prow"${clickable ? ` data-rice="${esc(p.id)}"` : ''}>
      <div class="pleft">${clickable ? `<button type="button" class="vlink pname" data-rice="${esc(p.id)}">${esc(p.name)}</button>` : `<div class="pname">${esc(p.name)}</div>`}<div class="psub">${nf(k)} kg sack${upd}</div></div>
      <div class="pright"><div class="pkg">${pesoP(pr.kg)}<small> / kilo</small></div><div class="psack">${pesoP(pr.sack)} / sack</div></div>
      ${showCost ? `<div class="pcost">Cost ${pesoP(ck)} / kilo · ${pesoP(cs)} / sack · profit ${pesoP(r2(pr.kg - ck))} a kilo${margin != null ? ` (${nf(margin, 1)}%)` : ''}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function mountPrices(el){
  S.ui.priceEdit = false;
  el.innerHTML = head('Price list', 'Selling prices for every rice.', `<div class="quick"><button type="button" class="btn big" id="pl-board">Show to customers</button><button type="button" class="btn big" id="pl-print">Print</button><button type="button" class="btn primary big" id="pl-edit" ${S.canWrite === false ? 'disabled' : ''}>Edit prices</button></div>`) + readOnlyNotice() +
    `<label class="small pl-costtoggle"><input type="checkbox" id="pl-cost" ${pref('prices.cost', '0') === '1' ? 'checked' : ''}> Show cost and profit (for the owner)</label><div id="pl-body"></div>`;
  $('#pl-cost', el).addEventListener('change', e => { setPref('prices.cost', e.target.checked ? '1' : '0'); if (!S.ui.priceEdit) updatePrices(); });
  $('#pl-edit', el).addEventListener('click', () => { S.ui.priceEdit = true; renderPriceEdit(); });
  $('#pl-board', el).addEventListener('click', openBoard);
  $('#pl-print', el).addEventListener('click', printPrices);

}
function updatePrices(){ if (S.ui.priceEdit) return; const b = $('#pl-body'); if (b) b.innerHTML = priceRows(pref('prices.cost', '0') === '1', true); }
function renderPriceEdit(){
  const b = $('#pl-body'); if (!b) return;
  const ps = activeProducts();
  const num = (cls, label, v) => `<label class="field"><span class="lbl">${label}</span><input type="number" class="${cls}" min="0" step="any" inputmode="decimal" value="${v || ''}"></label>`;
  b.innerHTML = `<form id="pe-f" class="form" novalidate><div class="plist">${ps.map(p => `<div class="prow edit" data-pid="${esc(p.id)}">
      <div><div class="pname">${esc(p.name)}</div><div class="psub">${nf(sackKgOf(p.id))} kg sack</div></div>
      <div class="pedit">${num('pe-pk', 'Selling / kilo (₱)', p.priceKg)}${num('pe-ps', 'Selling / sack (₱)', p.priceSack)}${num('pe-ck', 'Cost / kilo (₱)', p.costKg)}${num('pe-cs', 'Cost / sack (₱)', p.costSack)}</div>
    </div>`).join('')}</div>
    <div class="form-err" id="pe-err" role="alert"></div>
    <div class="count-bar"><span id="pe-sum">No changes yet</span><span class="quick"><button type="button" class="btn" id="pe-cancel">Cancel</button><button class="btn primary big" id="pe-go" disabled>Save prices</button></span></div></form>`;
  const F = ['priceKg', 'priceSack', 'costKg', 'costSack'], C = ['.pe-pk', '.pe-ps', '.pe-ck', '.pe-cs'];
  const changes = () => $$('#pe-f .prow').map(row => {
    const p = prod(row.dataset.pid); if (!p) return null;
    const next = {}; let diff = false;
    F.forEach((f, i) => { const v = +$(C[i], row).value || 0; next[f] = v; if (v !== (+p[f] || 0)) diff = true; });
    return diff ? {id: row.dataset.pid, next} : null;
  }).filter(Boolean);
  const paint = () => { const n = changes().length; $('#pe-sum').textContent = n ? `${n} ${n === 1 ? 'rice' : 'rices'} changed` : 'No changes yet'; $('#pe-go').disabled = !n; };
  $('#pe-f').addEventListener('input', e => { const row = e.target.closest('.prow'); if (row) row.classList.toggle('changed', !!changes().find(c => c.id === row.dataset.pid)); paint(); });
  $('#pe-cancel').addEventListener('click', () => { S.ui.priceEdit = false; updatePrices(); });
  $('#pe-f').addEventListener('submit', async e => {
    e.preventDefault();
    const list = changes(); if (!list.length) return;
    const btn = $('#pe-go'); btn.disabled = true; btn.textContent = 'Saving…';
    let done = 0;
    try {
      for (const c of list) { await withRetry(() => S.db.collection('products').doc(c.id).update(Object.assign({}, c.next, {pricesUpdatedAt: new Date().toISOString()}))); done++; }
      toast(`Saved new prices for ${done} ${done === 1 ? 'rice' : 'rices'}`);
      S.ui.priceEdit = false; updatePrices();
    } catch(e2){ $('#pe-err').textContent = (done ? `Saved ${done}, then stopped. ` : '') + explainDbError(e2); btn.disabled = false; btn.textContent = 'Save prices'; }
  });
}

function drawOutlookChart(kind){
  const box = $('#ol-chart'); if (!box) return;
  const hist = OUTLOOK.hist[kind], base = hist[hist.length - 1][1];
  const fc = OUTLOOK.periods.map(p => ({k: p.end, lo: base * (1 + p[kind][0] / 100), hi: base * (1 + p[kind][1] / 100)}));
  const months = [...hist.map(h => h[0])];
  for (const f of fc) { let [y, m] = months[months.length - 1].split('-').map(Number); while (`${y}-${String(m).padStart(2, '0')}` < f.k) { m++; if (m > 12) { m = 1; y++; } months.push(`${y}-${String(m).padStart(2, '0')}`); } }
  const W = 760, H = 280, L = 44, R = 14, T = 16, B = 34;
  const all = [...hist.map(h => h[1]), ...fc.map(f => f.lo), ...fc.map(f => f.hi)];
  const lo = Math.floor((Math.min(...all) - 1) / 5) * 5, hi = Math.ceil((Math.max(...all) + 1) / 5) * 5;
  const x = i => L + i * (W - L - R) / (months.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const iOf = k => months.indexOf(k);
  const band = [[hist.length - 1, base, base], ...fc.map(f => [iOf(f.k), f.lo, f.hi])];
  const area = 'M' + band.map(b => `${x(b[0]).toFixed(1)},${y(b[2]).toFixed(1)}`).join(' L') + ' L' + band.slice().reverse().map(b => `${x(b[0]).toFixed(1)},${y(b[1]).toFixed(1)}`).join(' L') + 'Z';
  const mid = band.map(b => `${x(b[0]).toFixed(1)},${y((b[1] + b[2]) / 2).toFixed(1)}`).join(' L');
  const line = hist.map((h, i) => `${x(i).toFixed(1)},${y(h[1]).toFixed(1)}`).join(' L');
  let grid = '';
  for (let v = lo; v <= hi; v += 5) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font:12px var(--f-body)">₱${v}</text>`;
  months.forEach((mk, i) => { if (mk.endsWith('-01') || i === months.length - 1) grid += `<text x="${x(i)}" y="${H - 12}" text-anchor="${i === months.length - 1 ? 'end' : 'middle'}" style="fill:var(--muted);font:12px var(--f-body)">${mk.endsWith('-01') ? mk.slice(0, 4) : parseD(mk + '-01').toLocaleDateString('en-PH', {month:'short'}) + ' ’' + mk.slice(2, 4)}</text>`; });
  const today = x(hist.length - 1);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price from January 2024 to September 2026 with the likely range to September 2027">
    ${grid}
    <line x1="${today}" x2="${today}" y1="${T}" y2="${H - B}" style="stroke:var(--muted)" stroke-dasharray="3 4"/>
    <text x="${today + 6}" y="${T + 12}" style="fill:var(--muted);font:600 12px var(--f-body)">Today</text>
    <path d="${area}" style="fill:var(--accent-soft)"/>
    <path d="M${mid}" style="stroke:var(--accent);fill:none" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M${line}" style="stroke:var(--accent);fill:none" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${today}" cy="${y(base)}" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>
    <text x="${today - 8}" y="${y(base) - 10}" text-anchor="end" style="fill:var(--fg);font:700 13px var(--f-body)">₱${nf(base)}</text>
    <line class="ol-x" x1="0" x2="0" y1="${T}" y2="${H - B}" style="stroke:var(--fg);opacity:0" stroke-width="1"/>
    <rect class="ol-hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg><div class="ol-tip-box" hidden></div>`;
  const svgEl = $('svg', box), tip = $('.ol-tip-box', box), xl = $('.ol-x', box);
  const show = ev => {
    const r = svgEl.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(months.length - 1, Math.round((px - L) / ((W - L - R) / (months.length - 1)))));
    const mk = months[i], h = hist.find(q => q[0] === mk), f = fc.find(q => q.k === mk);
    const label = parseD(mk + '-01').toLocaleDateString('en-PH', {month:'long', year:'numeric'});
    let txt;
    if (h) txt = `<b>${label}</b><br>₱${nf(h[1])} a kilo`;
    else if (f) txt = `<b>${label}</b><br>likely ₱${nf(f.lo)} – ₱${nf(f.hi)}`;
    else { const nxt = fc.find(q => q.k > mk) || fc[fc.length - 1]; txt = `<b>${label}</b><br>forecast (see ${parseD(nxt.k + '-01').toLocaleDateString('en-PH', {month:'short'})})`; }
    xl.setAttribute('x1', x(i)); xl.setAttribute('x2', x(i)); xl.style.opacity = .35;
    tip.innerHTML = txt; tip.hidden = false;
    const bx = box.getBoundingClientRect(), left = (x(i) / W) * r.width + (r.left - bx.left);
    tip.style.left = Math.max(0, Math.min(bx.width - 170, left + 10)) + 'px'; tip.style.top = '8px';
  };
  const hide = () => { tip.hidden = true; xl.style.opacity = 0; };
  svgEl.addEventListener('pointermove', show); svgEl.addEventListener('pointerdown', show); svgEl.addEventListener('pointerleave', hide);
}

/* ---------- RECEIPTS: photo library of delivery and purchase receipts ---------- */
let receiptsSub = null;
function watchReceipts(){
  if (receiptsSub || !S.db) return;
  S.receipts = S.receipts || []; S.receiptsLoaded = false;
  receiptsSub = S.db.collection('receipts').orderBy('createdAt', 'desc').limit(500).onSnapshot(
    s => { S.receipts = s.docs.map(d => Object.assign({id: d.id}, d.data())); S.receiptsLoaded = true; S.receiptsErr = null; schedule(); },
    e => { S.receiptsLoaded = true; S.receiptsErr = e; receiptsSub = null; schedule(); });
}
/* shrink a camera photo: big copy for storage, tiny copy for the library grid */
async function shrinkImage(file, max, q){
  let src, w, h;
  try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); w = src.width; h = src.height; }
  catch(e){ src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = src.naturalWidth; h = src.naturalHeight; }
  const sc = Math.min(1, max / Math.max(w, h)), cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(src, 0, 0, cw, ch);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', q));
  return {blob, w: cw, h: ch, dataUrl: c.toDataURL('image/jpeg', q)};
}
async function prepPhoto(file){
  const big = await shrinkImage(file, 1600, 0.72), small = await shrinkImage(file, 200, 0.6);
  if (!big.blob) throw new Error('decode');
  return {blob: big.blob, w: big.w, h: big.h, thumb: small.dataUrl, preview: URL.createObjectURL(big.blob)};
}
function receiptErr(e){
  if (e && e.code === 'no_bucket') return 'Photo storage is not set up yet. Run receipts-setup.sql in Supabase (see SETUP.md, step 1b).';
  return e instanceof UserError ? e.message : explainDbError(e);
}
async function saveReceipt(photo, meta){
  if (!S.files) throw new UserError('Receipt photos are not available here.');
  const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const d = meta.date || today(), path = `${d.slice(0, 4)}/${d.slice(5, 7)}/${id}.jpg`;
  await S.files.upload(path, photo.blob);
  const doc = {date: d, supplierId: meta.supplierId || null, amount: +meta.amount || 0, ref: meta.ref || '', notes: meta.notes || '', txnId: meta.txnId || null,
    path, thumb: photo.thumb, size: photo.blob.size, w: photo.w, h: photo.h, createdAt: new Date().toISOString(), by: S.uid || null, staff: staffList().length ? pref('staff', staffList()[0]) : ''};
  try { await withRetry(() => S.db.collection('receipts').doc(id).set(doc)); }
  catch(e){ try { await S.files.remove(path); } catch(_){} throw e; }
  return id;
}

      <dl class="rc-dl"><dt>Date</dt><dd>${fmtDate(r.date)}</dd><dt>Supplier</dt><dd>${esc(supName(r.supplierId) || '—')}</dd><dt>Amount</dt><dd class="num">${r.amount ? peso(r.amount) : '—'}</dd><dt>Receipt no.</dt><dd>${esc(r.ref || '—')}</dd>${dl ? `<dt>Delivery</dt><dd>${esc(dl)}</dd>` : ''}${r.notes ? `<dt>Notes</dt><dd>${esc(r.notes)}</dd>` : ''}<dt>Saved by</dt><dd>${esc(r.staff || '—')}</dd></dl>
      <div class="form-err" id="rcv-err" role="alert"></div>
      <div class="modal-actions"><button type="button" class="btn spacer" id="rcv-del" ${S.canWrite === false ? 'disabled' : ''}>Delete</button><a class="btn" id="rcv-open" target="_blank" rel="noopener">Open full size</a><button type="button" class="btn" id="rcv-edit" ${S.canWrite === false ? 'disabled' : ''}>Edit details</button><button type="button" class="btn primary" data-act="close-modal">Close</button></div>
    </div>`, m => {
    const img = $('#rcv-img', m), open = $('#rcv-open', m), err = $('#rcv-err', m);
    open.hidden = true;
    S.files.url(r.path).then(u => { const full = new Image(); full.onload = () => { img.src = u; img.classList.remove('loading-img'); }; full.src = u; open.href = u; open.hidden = false; })
      .catch(e => { err.textContent = 'The full photo could not be loaded. ' + receiptErr(e); });
    $('#rcv-edit', m).addEventListener('click', () => openReceiptForm(null, {receipt: r}));
    $('#rcv-del', m).addEventListener('click', async () => {
      const ok = await confirmBox('Delete this receipt?', `<p>The photo from <b>${esc(fmtDate(r.date))}</b>${r.amount ? ` (${esc(peso(r.amount))})` : ''} will be removed for good. Stock is not changed.</p>`, 'Delete receipt', true);
      if (!ok) return;
      try { try { await S.files.remove(r.path); } catch(_){} await withRetry(() => S.db.collection('receipts').doc(r.id).delete()); toast('Receipt deleted'); }
      catch(e){ toast(receiptErr(e), 'err'); }
    });
  });
}

/* ---------- page table ---------- */
const PAGES = {
  dashboard:{mount: mountDashboard, update: updateDashboard},
  inventory:{mount: mountInventory, update: () => renderInvBody(false)},
  'stock-in':{mount: mountStockIn, update: updateStockIn},
  'stock-out':{mount: mountStockOut, update: updateStockOut},
  transfer:{mount: mountTransfer, update: updateTransfer},
  count:{mount: mountCount, update: () => renderCount(false)},
  products:{mount: mountProducts, update: updateProducts},
  suppliers:{mount: mountSuppliers, update: updateSuppliers},
  reports:{mount: mountReports, update: () => { if (S.ui.rep.tab === 'inventory') runReport(); else updateReports(); }},
  settings:{mount: mountSettings},
  prices:{mount: mountPrices, update: updatePrices},
  outlook:{mount: mountOutlook},
  receipts:{mount: mountReceipts, update: updateReceipts},
  simple:{mount: mountSimple, update: updateSimple}
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    e.preventDefault();
    if (nav.dataset.prod) S.ui.pendingProd = nav.dataset.prod;
    if (nav.dataset.tab) S.ui.invTab = nav.dataset.tab;
    go(nav.dataset.nav); return;
  }
  const st = e.target.closest('[data-step]');
  if (st) {
    const inp = document.getElementById(st.dataset.for);
    if (inp) { inp.value = Math.max(0, Math.round(+inp.value || 0) + (+st.dataset.step)); inp.dispatchEvent(new Event('input', {bubbles: true})); }
    return;
  }
  const rc = e.target.closest('[data-rice]');
  if (rc && !S.ui.priceEdit && (e.target.closest('.vlink, .qtile') || !e.target.closest('button, a, input, select, label, textarea, [data-act]'))) { openRice(rc.dataset.rice); return; }
  const pf = e.target.closest('[data-pile-for]');
  if (pf) {
    const pre = pf.dataset.pileFor, sel = $('#' + pre + '-prod'), pid = sel && sel.value;
    if (!prod(pid)) { toast('Choose a rice variety first.', 'err'); return; }
    openPileCounter(pid, sacks => {
      const sk = document.querySelector('input[name="' + pre + '-unit"][value="sack"]');
      if (sk && !sk.checked) { sk.checked = true; sk.dispatchEvent(new Event('change', {bubbles: true})); }
      const q = $('#' + pre + '-qty'); q.value = sacks; q.dispatchEvent(new Event('input', {bubbles: true}));
    }, {noKg: true});
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'more') openSheet();
  else if (act === 'close-sheet' && e.target === a) closeSheet();
  else if (act === 'modal-back' && e.target === a) closeModal();
  else if (act === 'close-modal') closeModal();
  else if (act === 'new-product') openProduct(null);
  else if (act === 'edit-product') openProduct(a.dataset.id);
  else if (act === 'archive-product') toggleArchive(a.dataset.id);
  else if (act === 'new-supplier') openSupplier(null);
  else if (act === 'edit-supplier') openSupplier(a.dataset.id);
  else if (act === 'delete-supplier') { const id = a.dataset.id; withRetry(() => S.db.collection('suppliers').doc(id).delete()).then(() => { closeModal(); toast('Supplier deleted'); }, err => toast(explainDbError(err), 'err')); }
  else if (act === 'adjust') openAdjust(a.dataset.id);
  else if (act === 'hist-more') { S.ui.histLimit += 300; renderHistory(); }
  else if (act === 'hist-csv') exportHistory();
  else if (act === 'rep-csv') exportReport(a.dataset.key);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root-2').innerHTML) closePile(); else if ($('#modal-root').innerHTML) closeModal(); else closeSheet(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.page && PAGES[h]) go(h); });

if (pref('bigtext', '0') === '1') document.documentElement.classList.add('big-text');
const start = location.hash.slice(1);
if (PAGES[start] && start !== 'simple') S.page = start;
if (simpleCfg()) { S.page = 'simple'; document.body.classList.add('simple'); }
mountPage();
boot();
})();
</script>
