<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bigasan Inventory</title>
<meta name="description" content="Rice stock for the Stall and the Bodega">
<meta name="theme-color" content="#1D6A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: left rail on desktop, bottom tab bar on phones; content is a single column of panels, summary first. */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --surface-2:#E9EEE6; --fg:#18221C; --muted:#5A675F; --line:#D6DDD3;
  --accent:#1D6A4A; --accent-fg:#FFFFFF; --accent-soft:#D8EDE2;
  --bodega:#2D6A8C; --stall:#C08417;
  --danger:#B9332A; --danger-soft:#FBE4E1; --ok:#2B7A4B; --ok-soft:#DDF0E4; --warn:#9A5B00; --warn-soft:#FBEBCB;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201B; --surface-2:#212B25; --fg:#E6ECE7; --muted:#9BA9A0; --line:#2C3830;
  --accent:#5CC796; --accent-fg:#0B1A12; --accent-soft:#1B3628;
  --bodega:#6BB3DA; --stall:#E5B04B;
  --danger:#F07A6E; --danger-soft:#3A1E1B; --ok:#6BCB8F; --ok-soft:#183223; --warn:#E9B35A; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --surface-2:#212B25; --fg:#E6ECE7; --muted:#9BA9A0; --line:#2C3830;
  --accent:#5CC796; --accent-fg:#0B1A12; --accent-soft:#1B3628;
  --bodega:#6BB3DA; --stall:#E5B04B;
  --danger:#F07A6E; --danger-soft:#3A1E1B; --ok:#6BCB8F; --ok-soft:#183223; --warn:#E9B35A; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);line-height:1.1}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.1}
.brand-sub{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px}
main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:28px 60px;max-width:1240px;width:100%}
.tabbar{display:none}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:10px;min-height:52px;justify-content:center;cursor:pointer}
  .tabbar svg{width:24px;height:24px}
  .tabbar [aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
}

/* sheet (phone "More") */
.sheet-back{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--fg);font-weight:600;font-size:.85rem;text-align:center}
.sheet a svg{width:24px;height:24px;color:var(--accent)}

/* page head */
.page-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.page-head .lead{color:var(--muted);max-width:62ch}
.quick{display:flex;flex-wrap:wrap;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.big{min-height:56px;font-size:1.08rem;padding-inline:26px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}

/* panels & cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:.9rem}
.kpi .k-val{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,1.3rem + 1vw,2.1rem);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:.55em;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .k-sub{font-size:.85rem;color:var(--muted)}
.kpi.alert{border-color:var(--danger);background:var(--danger-soft)}
.kpi.alert .k-val,.kpi.alert .k-label{color:var(--danger)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dot.bodega{background:var(--bodega)} .dot.stall{background:var(--stall)} .dot.total{background:var(--accent)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;margin-bottom:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-grid{grid-template-columns:minmax(0,1fr)}}

/* split bar */
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:60px}
.split span{display:block;height:100%}
.split .b{background:var(--bodega)} .split .s{background:var(--stall)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.pill.low{background:var(--danger);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.t-in{background:var(--ok-soft);color:var(--ok)}
.t-out{background:var(--warn-soft);color:var(--warn)}
.t-tin,.t-tout{background:var(--accent-soft);color:var(--accent)}
.t-adjust{background:var(--surface-2);color:var(--muted)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:.75rem;font-weight:700;display:inline-grid;place-items:center}
.loc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* variety rows */
.vlist{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.vrow.head{border-top:0;padding-block:4px 8px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.vrow .vname{font-weight:700;display:flex;flex-direction:column;gap:6px;min-width:0}
.vrow .vname .sub{font-weight:400;font-size:.82rem;color:var(--muted)}
.vrow .cell{display:flex;flex-direction:column;gap:1px;min-width:0}
.vrow .cell .kg{font-size:.78rem;color:var(--muted)}
.vrow .lbl{display:none}
@media (max-width:640px){
  .vrow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px}
  .vrow.head{display:none}
  .vrow .vname{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .vrow .vname .split{flex-basis:100%}
  .vrow .lbl{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .vrow .act{grid-column:1/-1}
}

/* tables */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
.t th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.t td.r,.t th.r{text-align:right}
.t tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
.t .neg{color:var(--danger)} .t .pos{color:var(--ok)}
@media (max-width:700px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td,table.rt tfoot{display:block;width:100%}
  table.rt tr{padding:10px 4px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  table.rt td{border:0;padding:0;text-align:left!important}
  table.rt td::before{content:attr(data-l);display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  table.rt td.wide{grid-column:1/-1}
  table.rt td:empty{display:none}
}

/* recent feed */
.feed{display:flex;flex-direction:column}
.feed-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.feed-row:first-child{border-top:0}
.feed-row .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.feed-row .what b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row .qty{text-align:right;font-weight:700}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.5vw,24px)}
.form-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.form-layout{grid-template-columns:minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-weight:700;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.field.full{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],input[type=tel],input:not([type]),select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);font-size:1rem}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:0}
input[readonly]{background:var(--surface-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:max-content;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);font-weight:700;cursor:pointer;text-align:center}
.seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.calc{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.95rem}
.calc:empty{display:none}
.calc b{font-family:var(--f-num)}
.avail{font-size:.9rem;padding:8px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.avail.bad{background:var(--danger-soft);color:var(--danger);font-weight:700}
.form-err{color:var(--danger);font-weight:700;background:var(--danger-soft);border-radius:var(--r-sm);padding:12px 14px}
.form-err:empty{display:none}
.side-note{display:flex;flex-direction:column;gap:12px}
/* counting: steppers, count page, pile counter */
.stepper{display:inline-flex;align-items:stretch}
.stepper button{width:52px;min-height:52px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:1.5rem;font-weight:700;line-height:1;cursor:pointer}
.stepper button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.stepper button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.stepper button:active{background:var(--accent-soft)}
.stepper input{width:84px;min-height:52px;border-radius:0;border-inline:0;text-align:center;font-size:1.2rem;font-weight:700}
.cinputs{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.cinputs .c-k{width:92px;min-height:52px;text-align:center;font-size:1.1rem}
.link-btn{background:none;border:0;padding:6px 0;min-height:36px;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;align-self:flex-start}
.count-loc{max-width:420px;margin-bottom:14px}
.count-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.crow.changed{border-color:var(--accent);background:var(--accent-soft)}
.crow .ctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.crow .cname{font-weight:700}
.cdiff{font-size:.9rem;color:var(--muted)}
.cdiff.up,.calc .up{color:var(--ok);font-weight:700}
.cdiff.down,.calc .down{color:var(--danger);font-weight:700}
.count-bar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);font-weight:700}
@media (max-width:899px){.count-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
#modal-root-2 .modal-back{z-index:55}
.piles{display:flex;flex-direction:column;gap:10px}
.pile{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pile input{width:80px;min-height:52px;text-align:center;font-size:1.2rem;font-weight:700}
.pile span{color:var(--muted)}
.pile .pl-sum{min-width:60px;font-size:1.1rem}
.pile-total{padding:12px 16px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);font-size:1.05rem}
.pile-total b{font-family:var(--f-display);font-size:1.5rem;margin-left:4px}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;color:var(--accent)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";width:24px;height:24px;border-radius:6px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.1rem;line-height:1}
details.more[open] summary::before{content:"−"}
details.more summary .muted{font-weight:400;font-size:.88rem}
details.more .grid2{margin-top:10px}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);margin-bottom:16px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner p{max-width:80ch}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .field{flex:1 1 150px}
.filters .field select,.filters .field input{min-height:44px}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard.low{border-color:var(--danger)}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.9rem}
.pcard dt{color:var(--muted)} .pcard dd{margin:0;text-align:right;font-family:var(--f-num)}
.pcard .stockline{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;padding:clamp(18px,3vw,26px);width:min(640px,100%);margin-block:4vh;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.modal-actions .spacer{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:#fff}
@media (max-width:899px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.loading{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:40px 0;color:var(--muted)}
.skel{height:84px;border-radius:var(--r);background:var(--surface-2);width:100%}
.setting-row{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.setting-row:first-of-type{border-top:0}
.setting-row > div:first-child{display:flex;flex-direction:column;gap:4px;max-width:60ch}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.seg span{transition:background-color .15s,border-color .15s}}

/* sign-in / setup gate and offline notice (hosted version) */
[hidden]{display:none!important}
body{margin:0}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,8vh) 16px 24px;overflow-y:auto}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.gate .brand{padding:0}
.offline-bar{position:fixed;left:0;right:0;top:0;z-index:90;background:var(--warn);color:#fff;font-weight:700;font-size:.9rem;text-align:center;padding:8px 16px calc(8px);padding-top:calc(8px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1.2 3.2A7 7 0 0 1 19 12.5V17a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-4.5a7 7 0 0 1 4.2-6.3z"/><path d="M9 6.5h6"/></svg></div>
      <div><div class="brand-name" id="brand-name">Bigasan</div><div class="brand-sub">Stall &amp; Bodega stock</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
</div>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="modal-root-2"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="vendor/supabase-2.117.3.js"></script>
<script src="config.js"></script>
<script src="db-supabase.js"></script>
<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const LOC = {bodega:'Bodega', stall:'Stall'};
const LOCS = ['bodega','stall'];
const KIND = {in:'Stock In', out:'Sale / Stock Out', tin:'Transfer In', tout:'Transfer Out', adjust:'Adjustment'};
const OUT_REASONS = ['Sale','Damaged / spoiled','Own use','Returned to supplier','Other'];
const ADJ_REASONS = ['Physical count','Damaged / spoiled','Correction','Opening stock','Other'];
const TAB_ID = 'tab-' + Math.random().toString(36).slice(2,10);

const ICON = {
  dashboard:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/>',
  inventory:'<path d="M8 3h8l-1.2 3.2A7 7 0 0 1 19 12.5V17a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-4.5a7 7 0 0 1 4.2-6.3z"/><path d="M9 6.5h6"/>',
  'stock-in':'<path d="M12 3v11m-4.5-4.5L12 14l4.5-4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
  'stock-out':'<path d="M12 14V3M7.5 7.5 12 3l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
  transfer:'<path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/>',
  count:'<path d="M9 3h6v3H9z"/><path d="M15 4.5h2a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 13.5 2 2 4-4"/>',
  products:'<path d="M3 12V4h8l9.5 9.5-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>',
  suppliers:'<path d="M2 6h12v10H2zM14 10h4.5L22 13.5V16h-8"/><circle cx="6.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  reports:'<path d="M5 20V11m7 9V4m7 16v-6M3 20.5h18"/>',
  settings:'<path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  swap:'<path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const svg = (k, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- state ---------- */
const S = {
  db:null, user:null, uid:null, downloads:null, canWrite:null, status:'connecting',
  products:{}, suppliers:{}, stock:{}, txns:[], txnsComplete:false, settings:{},
  loaded:{products:false,suppliers:false,stock:false,txns:false,settings:false},
  page:'dashboard', mounted:false, names:{}, ui:{invTab:'onhand', hist:{prod:'',loc:'',kind:'',from:'',to:''}, histLimit:200, rep:{tab:'summary',preset:'month',from:'',to:'',prod:'',loc:'',group:'day'}, showArchived:false}
};

/* ---------- utils ---------- */
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3 = x => Math.round((+x || 0) * 1000) / 1000;
const r2 = x => Math.round((+x || 0) * 100) / 100;
const nf = (x, d) => (+x || 0).toLocaleString('en-PH', {maximumFractionDigits: d == null ? 2 : d});
const peso = x => '₱' + (+x || 0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const z2 = n => String(n).padStart(2, '0');
const localDate = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
const today = () => localDate(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return localDate(d); };
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'}) : '';
const fmtDateShort = s => s ? parseD(s).toLocaleDateString('en-PH', {month:'short', day:'numeric'}) : '';
const fmtTime = iso => { try { return new Date(iso).toLocaleTimeString('en-PH', {hour:'numeric', minute:'2-digit'}); } catch(e){ return ''; } };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30) || 'item';
function pref(k, d){ try { const v = localStorage.getItem('bigasan.'+k); return v == null ? d : v; } catch(e){ return d; } }
function setPref(k, v){ try { localStorage.setItem('bigasan.'+k, v); } catch(e){} }
function weekStart(s){ const d = parseD(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return localDate(d); }

/* ---------- domain helpers ---------- */
const prod = id => S.products[id];
const sackKgOf = id => +(prod(id) && prod(id).sackKg) || 50;
function bal(id){ const s = S.stock[id] || {}; const b = r3(s.bodega||0), st = r3(s.stall||0); return {bodega:b, stall:st, total:r3(b+st)}; }
function costKgOf(p){ if (!p) return 0; if (+p.costKg) return +p.costKg; return +p.sackKg ? r2((+p.costSack||0)/(+p.sackKg)) : 0; }
function priceKgOf(p){ if (!p) return 0; if (+p.priceKg) return +p.priceKg; return +p.sackKg ? r2((+p.priceSack||0)/(+p.sackKg)) : 0; }
function isLow(id){ const p = prod(id); if (!p || p.archived || !(+p.minSacks)) return false; return bal(id).total / sackKgOf(id) < +p.minSacks - 1e-9; }
function activeProducts(){ return Object.keys(S.products).filter(id => !S.products[id].archived).map(id => Object.assign({id}, S.products[id])).sort((a,b) => String(a.name).localeCompare(String(b.name))); }
function allProducts(){ return Object.keys(S.products).map(id => Object.assign({id}, S.products[id])).sort((a,b) => String(a.name).localeCompare(String(b.name))); }
function supplierList(){ return Object.keys(S.suppliers).map(id => Object.assign({id}, S.suppliers[id])).sort((a,b) => String(a.name).localeCompare(String(b.name))); }
const supName = id => (S.suppliers[id] && S.suppliers[id].name) || '';
const bizName = () => (S.settings && S.settings.businessName) || 'My Bigasan';
const staffList = () => Array.isArray(S.settings.staff) ? S.settings.staff.filter(Boolean) : [];
function sacksTxt(n){ return nf(n, 2) + (Math.abs(n - 1) < 1e-9 ? ' sack' : ' sacks'); }
/* "8 sacks + 12.5 kg" */
function fmtStock(kg, skg, short){
  kg = r3(kg); const neg = kg < 0; const a = Math.abs(kg); skg = +skg || 50;
  const full = Math.floor(a / skg + 1e-9); const rem = r3(a - full * skg);
  const sk = n => short ? 'sk' : (n === 1 ? 'sack' : 'sacks');
  let s;
  if (full && rem) s = `${nf(full,0)} ${sk(full)} + ${nf(rem)} kg`;
  else if (full) s = `${nf(full,0)} ${sk(full)}`;
  else if (rem) s = `${nf(rem)} kg`;
  else s = `0 ${sk(0)}`;
  return (neg ? '−' : '') + s;
}
function qtyEntered(t){ return t.unit === 'kg' ? `${nf(t.qty)} kg` : sacksTxt(+t.qty||0); }
function insufficientMsg(availKg, unit, skg){
  if (unit === 'kg') return `Insufficient stock. Only ${nf(availKg)} kg available.`;
  const s = availKg / skg; const whole = Math.abs(s - Math.round(s)) < 1e-6;
  return `Insufficient stock. Only ${sacksTxt(whole ? Math.round(s) : r2(s))} available${whole ? '' : ` (${nf(availKg)} kg)`}.`;
}
/* one txn → one history row per location it touched */
function rowsOf(t){
  return (t.moves || []).map(m => ({t, m, kind: t.type === 'transfer' ? (m.kg < 0 ? 'tout' : 'tin') : t.type}));
}
function userOf(t){ return t.staff || (t.by && S.names[t.by]) || '—'; }

/* ---------- db layer ---------- */
class UserError extends Error {}
class StockError extends Error { constructor(loc, avail){ super('insufficient'); this.loc = loc; this.avail = avail; } }
async function withRetry(fn){
  try { return await fn(); }
  catch(e){
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(500 + Math.random()*700); return await fn(); }
    throw e;
  }
}
function explainDbError(e){
  if (e instanceof UserError) return e.message;
  const c = e && e.code;
  if (c === 'invalid_argument') { S.canWrite = false; renderFoot(); return 'This account is not allowed to record changes. Sign out and sign in with the business account.'; }
  if (c === 'quota_exceeded') return 'The database is full. Export a backup in Settings, then remove old transactions.';
  if (c === 'resource_exhausted') return 'Too many saves at once. Wait a few seconds and try again.';
  if (c === 'revoked' || c === 'not_granted') return 'Access to the inventory was removed for this page. Reload to try again.';
  return 'Could not save. Check your connection and try again.';
}
async function lockStock(ref){
  if (typeof ref.acquire !== 'function') return;
  for (let i = 0; i < 14; i++) {
    let res;
    try { res = await ref.acquire({holder: TAB_ID, ttlMs: 5000}); } catch(e){ return; }
    if (res && res.acquired) return;
    await sleep(450);
  }
  throw new UserError('Another phone or computer is saving this rice variety right now. Try again in a few seconds.');
}
/* The only way stock changes: lock the product's balance, re-read it, check every move, write the log entry, then the new balance. */
async function commit(pid, moves, fields){
  if (S.db.commitTxn) {
    try { return await S.db.commitTxn(pid, moves, fields); }
    catch(e){
      if (e && e.code === 'insufficient') throw new StockError(e.loc, e.avail);
      if (e && e.code === 'nochange') throw new UserError('Nothing to change. The counted stock already matches the system.');
      throw e;
    }
  }
  const ref = S.db.doc('stock/' + pid);
  await lockStock(ref);
  const snap = await withRetry(() => ref.get());
  const cur = snap.exists ? (snap.data() || {}) : {};
  const b = {bodega: r3(cur.bodega||0), stall: r3(cur.stall||0)};
  const out = [];
  for (const m of moves) {
    const prev = b[m.loc];
    const delta = m.setTo != null ? r3(m.setTo - prev) : r3(m.kg);
    const next = r3(prev + delta);
    if (next < -0.0005) throw new StockError(m.loc, prev);
    if (Math.abs(delta) < 0.0005 && m.setTo != null) continue;
    b[m.loc] = next;
    out.push({loc: m.loc, kg: delta, prev, next});
  }
  if (!out.length) throw new UserError('Nothing to change. The counted stock already matches the system.');
  const id = newId('t');
  const at = new Date().toISOString();
  const txn = Object.assign({}, fields, {productId: pid, moves: out, at, by: S.uid || null});
  await withRetry(() => S.db.collection('txns').doc(id).set(txn));
  await withRetry(() => ref.set({bodega: b.bodega, stall: b.stall, updatedAt: at, lastTxn: id}));
  return txn;
}
async function fetchTxns(from, to){
  if (S.txnsComplete) return S.txns.filter(t => (!from || t.date >= from) && (!to || t.date <= to)).slice().sort((a,b) => a.at < b.at ? -1 : 1);
  const out = [], seen = new Set(); let cursor = '';
  for (let guard = 0; guard < 200; guard++) {
    let q = S.db.collection('txns');
    if (from) q = q.where('date', '>=', from);
    if (to) q = q.where('date', '<=', to);
    if (cursor) q = q.where('at', '>=', cursor);
    q = q.orderBy('at', 'asc').limit(1000);
    const snap = await withRetry(() => q.get());
    let added = 0;
    for (const d of snap.docs) { if (seen.has(d.id)) continue; seen.add(d.id); out.push(Object.assign({id: d.id}, d.data())); added++; }
    if (snap.size < 1000 || !added) break;
    cursor = snap.docs[snap.docs.length-1].data().at;
  }
  return out;
}
async function fetchCollection(name){
  const snap = await withRetry(() => S.db.collection(name).limit(1000).get());
  return snap.docs.map(d => Object.assign({id: d.id}, d.data()));
}

/* ---------- boot ---------- */
async function boot(){
  renderNav(); renderTabbar();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.status = 'nodb'; mountPage(); return; }
  const [db, user, downloads] = await Promise.all([
    c.use('db').catch(() => null), c.use('user').catch(() => null), c.use('downloads').catch(() => null)
  ]);
  S.db = db; S.user = user; S.downloads = downloads;
  if (!db) { S.status = 'nodb'; mountPage(); return; }
  if (user) {
    try { S.uid = await user.id(); } catch(e){}
    try { S.canWrite = await user.can('data.write'); } catch(e){ S.canWrite = null; }
  }
  S.status = 'live';
  subscribe();
  renderFoot();
  mountPage();
}
function subscribe(){
  const err = name => e => { console.warn(name, e); if (e && e.code === 'unavailable') setTimeout(subscribe1[name], 2000); else { S.loaded[name] = true; schedule(); } };
  const subscribe1 = {
    products: () => S.db.collection('products').onSnapshot(s => { S.products = mapDocs(s); S.loaded.products = true; schedule(); }, err('products')),
    suppliers: () => S.db.collection('suppliers').onSnapshot(s => { S.suppliers = mapDocs(s); S.loaded.suppliers = true; schedule(); }, err('suppliers')),
    stock: () => S.db.collection('stock').onSnapshot(s => { S.stock = mapDocs(s); S.loaded.stock = true; schedule(); }, err('stock')),
    txns: () => S.db.collection('txns').orderBy('at','desc').limit(1000).onSnapshot(s => { S.txns = s.docs.map(d => Object.assign({id: d.id}, d.data())); S.txnsComplete = s.size < 1000; S.loaded.txns = true; schedule(); }, err('txns')),
    settings: () => S.db.doc('settings/main').onSnapshot(d => { S.settings = (d.exists && d.data()) || {}; S.loaded.settings = true; schedule(); }, err('settings'))
  };
  Object.values(subscribe1).forEach(f => f());
}
function mapDocs(s){ const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); return o; }
const dataReady = () => Object.values(S.loaded).every(Boolean);
let raf = 0;
function schedule(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; onData(); }); }
function onData(){
  $('#brand-name').textContent = bizName();
  renderNav(); renderTabbar();
  if (!S.mounted) { if (dataReady()) mountPage(); return; }
  const pg = PAGES[S.page]; if (pg.update) pg.update();
}

/* ---------- navigation ---------- */
const NAV = [
  ['dashboard','Dashboard'],['inventory','Inventory'],['stock-in','Stock In'],['stock-out','Stock Out'],['transfer','Transfer'],['count','Count stock'],
  ['products','Products'],['suppliers','Suppliers'],['reports','Reports'],['settings','Settings']
];
function lowCount(){ return activeProducts().filter(p => isLow(p.id)).length; }
function renderNav(){
  const low = dataReady() ? lowCount() : 0;
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#${k}" data-nav="${k}" ${S.page === k ? 'aria-current="page"' : ''}>${svg(k)}<span>${l}</span>${k === 'inventory' && low ? `<span class="badge" title="${low} low-stock">${low}</span>` : ''}</a>`).join('');
}
function renderTabbar(){
  const items = [['dashboard','Home'],['stock-in','Stock In'],['stock-out','Sell'],['transfer','Transfer']];
  const inMore = !items.some(([k]) => k === S.page);
  $('#tabbar').innerHTML = items.map(([k, l]) => `<a href="#${k}" data-nav="${k}" ${S.page === k ? 'aria-current="page"' : ''}>${svg(k)}<span>${l}</span></a>`).join('') +
    `<button type="button" data-act="more" ${inMore ? 'aria-current="page"' : ''}>${svg('more')}<span>${inMore ? esc((NAV.find(n => n[0] === S.page) || [,'More'])[1]) : 'More'}</span></button>`;
}
function renderFoot(){
  const f = $('#side-foot'); if (!f) return;
  f.textContent = S.status !== 'live' ? '' : (S.canWrite === false ? 'View only on this account' : 'Saved online · syncs across devices');
}
function openSheet(){
  $('#sheet-root').innerHTML = `<div class="sheet-back" data-act="close-sheet"><div class="sheet" role="menu">${NAV.map(([k, l]) => `<a href="#${k}" data-nav="${k}" role="menuitem">${svg(k)}${l}</a>`).join('')}</div></div>`;
}
function closeSheet(){ $('#sheet-root').innerHTML = ''; }
function go(page){
  if (!PAGES[page]) page = 'dashboard';
  S.page = page;
  try { if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page); } catch(e){}
  closeSheet(); renderNav(); renderTabbar(); mountPage();
  try { window.scrollTo(0, 0); } catch(e){}
}
function mountPage(){
  const main = $('#main');
  if (S.status === 'nodb') { S.mounted = false; main.innerHTML = noDbHtml(); return; }
  if (!dataReady()) { S.mounted = false; main.innerHTML = `<div class="loading"><p class="eyebrow">Loading inventory…</p><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`; return; }
  const pg = PAGES[S.page];
  main.innerHTML = '';
  const wrap = document.createElement('div'); main.appendChild(wrap);
  pg.mount(wrap);
  S.mounted = true;
  if (pg.update) pg.update();
}
function noDbHtml(){
  return `<div class="page-head"><div><p class="eyebrow">Bigasan Inventory</p><h1>Setup needed</h1></div></div>
  <div class="card stack"><p>The app is not connected to its database yet. Add your Supabase details to config.js (see SETUP.md), upload again, and reload.</p></div>`;
}

/* ---------- shared UI bits ---------- */
function head(title, lead, extra){ return `<div class="page-head"><div><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div>${extra || ''}</div>`; }
function toast(msg, kind){
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = msg;
  const root = $('#toast-root'); root.innerHTML = ''; root.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, kind === 'err' ? 6000 : 3500);
}
function openModal(html, onMount){
  $('#modal-root').innerHTML = `<div class="modal-back" data-act="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $('#modal-root .modal');
  if (onMount) onMount(m);
  const first = m.querySelector('input,select,textarea'); if (first) setTimeout(() => { try { first.focus(); } catch(e){} }, 30);
  return m;
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function confirmBox(title, body, okLabel, danger){
  return new Promise(res => {
    openModal(`<h2>${esc(title)}</h2><div>${body}</div><div class="modal-actions"><button class="btn" data-x="no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-x="yes">${esc(okLabel)}</button></div>`, m => {

function histRows(){
  const h = S.ui.hist, rows = [];

    if (h.prod && t.productId !== h.prod) continue;

    if (h.to && t.date > h.to) continue;
    for (const r of rowsOf(t)) { if (h.loc && r.m.loc !== h.loc) continue; if (h.kind && r.kind !== h.kind) continue; rows.push(r); }
  }
  rows.sort((a, b) => (b.t.date + b.t.at) < (a.t.date + a.t.at) ? -1 : 1);

}

/* ---------- COUNTING HELPERS: + / − steppers and the pile counter ---------- */
function stepper(id, val, cls){
  return `<div class="stepper"><button type="button" data-step="-1" data-for="${id}" aria-label="One less">−</button><input type="number" id="${id}" class="${cls || ''}" min="0" step="1" inputmode="numeric" value="${val}"><button type="button" data-step="1" data-for="${id}" aria-label="One more">+</button></div>`;
}
function splitKg(kg, k){ const s = Math.floor(kg / k + 1e-9); return {sacks: s, kg: r3(kg - s * k)}; }
/* "24 high × 5 in the row" for each pile, plus loose sacks and an open sack → total */
function openPileCounter(pid, onUse, opts){
  const p = prod(pid); if (!p) return;
  const k = sackKgOf(pid), withKg = !(opts && opts.noKg);
  const root = $('#modal-root-2');
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="Count by piles">
    <h2>Count by piles</h2>
    <p class="muted">${esc(p.name)} · ${nf(k)} kg sacks. For each pile, enter how many sacks high it is and how many sacks are in its row.</p>
    <div class="piles" id="pl-list"></div>
    <div><button type="button" class="btn sm" id="pl-add">${svg('plus')}Add another pile</button></div>
    <div class="grid2"><div class="field"><label for="pl-extra">Extra loose sacks</label>${stepper('pl-extra', 0)}</div>${withKg ? `<div class="field"><label for="pl-kg">Open sack (kg)</label><input type="number" id="pl-kg" min="0" step="any" inputmode="decimal" value="0"></div>` : ''}</div>
    <div class="pile-total" id="pl-total" aria-live="polite"></div>
    <div class="modal-actions"><button type="button" class="btn" id="pl-cancel">Cancel</button><button type="button" class="btn primary" id="pl-use">Use this count</button></div>
  </div></div>`;
  const back = root.firstElementChild, list = $('#pl-list', back);
  const addRow = () => {
    const row = document.createElement('div'); row.className = 'pile';
    row.innerHTML = `<input type="number" class="pl-h" min="0" step="1" inputmode="numeric" placeholder="24" aria-label="Sacks high"><span>high ×</span><input type="number" class="pl-w" min="0" step="1" inputmode="numeric" placeholder="5" aria-label="Sacks in the row"><span>in the row</span><b class="pl-sum">= 0</b><button type="button" class="btn sm ghost pl-del" aria-label="Remove this pile">✕</button>`;
    list.appendChild(row); return row;
  };
  const whole = v => Math.max(0, Math.floor(+v || 0));
  const total = () => {
    let s = 0;
    $$('.pile', list).forEach(row => { const n = whole($('.pl-h', row).value) * whole($('.pl-w', row).value); s += n; $('.pl-sum', row).textContent = '= ' + nf(n, 0); });
    s += whole($('#pl-extra', back).value);
    return {sacks: s, kg: withKg ? Math.max(0, r3(+$('#pl-kg', back).value || 0)) : 0};
  };
  const show = () => { const t = total(); $('#pl-total', back).innerHTML = `Total <b>${nf(t.sacks, 0)} ${t.sacks === 1 ? 'sack' : 'sacks'}${t.kg ? ' + ' + nf(t.kg) + ' kg' : ''}</b> <span class="small">(${nf(t.sacks * k + t.kg)} kg)</span>`; };
  back.addEventListener('input', show);
  back.addEventListener('click', e => {
    if (e.target === back || e.target.closest('#pl-cancel')) { closePile(); return; }
    const del = e.target.closest('.pl-del');
    if (del) { const row = del.closest('.pile'); if ($$('.pile', list).length > 1) row.remove(); else { $('.pl-h', row).value = ''; $('.pl-w', row).value = ''; } show(); }
  });
  $('#pl-add', back).addEventListener('click', () => { const row = addRow(); show(); $('.pl-h', row).focus(); });
  $('#pl-use', back).addEventListener('click', () => { const t = total(); closePile(); onUse(t.sacks, t.kg); });
  addRow(); show();
  setTimeout(() => { const i = $('.pl-h', list); if (i) i.focus(); }, 30);
}
function closePile(){ $('#modal-root-2').innerHTML = ''; }

  const k = sackKgOf(pid);
  openModal(`<h2>Count · ${esc(p.name)}</h2>

        <button type="button" class="link-btn" id="adj-pile">Count by piles (e.g. 24 high × 5)</button></div>
      <div class="calc" id="adj-calc"></div>
      ${moreBox('adj', `<div class="field"><label for="adj-reason">Reason</label><select id="adj-reason">${ADJ_REASONS.map(r => `<option>${r}</option>`).join('')}</select></div>
        <div class="field"><label for="adj-date">Date</label><input type="date" id="adj-date" value="${today()}"></div>
        <div class="field full"><label for="adj-notes">Notes</label><input id="adj-notes" autocomplete="off" placeholder="e.g. 2 sacks wet from roof leak"></div>`)}
      <div class="form-err" id="adj-err" role="alert"></div>
      <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="adj-go" ${S.canWrite === false ? 'disabled' : ''}>Save count</button></div>
    </form>`, m => {
      const f = $('#adj-f', m);
      const loc = () => segVal(f, 'adj-loc');
      const counted = () => r3(Math.max(0, Math.floor(+$('#adj-sacks', m).value || 0)) * k + Math.max(0, +$('#adj-kg', m).value || 0));
      const show = () => {
        const cur = bal(pid)[loc()], d = r3(counted() - cur);
        $('#adj-cur', m).innerHTML = `System says ${LOC[loc()]} has <b class="num">${fmtStock(cur, k)}</b>`;
        $('#adj-calc', m).innerHTML = Math.abs(d) < 0.0005 ? `<span>Same as the system. Change the numbers if the count is different.</span>`
          : `<span>New count <b>${fmtStock(counted(), k)}</b></span><span>Difference <b class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmtStock(Math.abs(d), k)}</b></span>`;
        moreSum('adj');
      };
      const preset = () => { const s = splitKg(bal(pid)[loc()], k); $('#adj-sacks', m).value = s.sacks; $('#adj-kg', m).value = s.kg; show(); };
      f.addEventListener('change', e => { if (e.target.name === 'adj-loc') { setPref('count.loc', e.target.value); preset(); } else show(); });
      f.addEventListener('input', show);
      $('#adj-pile', m).addEventListener('click', () => openPileCounter(pid, (sacks, kg) => { $('#adj-sacks', m).value = sacks; $('#adj-kg', m).value = kg; show(); }));
      f.addEventListener('submit', async e => {
        e.preventDefault(); const err = $('#adj-err', m); err.textContent = '';
        if (Math.abs(counted() - bal(pid)[loc()]) < 0.0005) return err.textContent = 'Nothing to save. The count matches the system.';
        const btn = $('#adj-go', m); btn.disabled = true; btn.textContent = 'Saving…';
        try {
          await commit(pid, [{loc: loc(), setTo: counted()}], {type:'adjust', date: $('#adj-date', m).value || today(), reason: $('#adj-reason', m).value, unit:'kg', sackKg: k,
            notes: $('#adj-notes', m).value.trim(), staff: staffList().length ? pref('staff', staffList()[0]) : ''});
          closeModal(); toast(`${p.name} at ${LOC[loc()]} is now ${fmtStock(counted(), k)}`);
        } catch(e2){ err.textContent = e2 instanceof UserError ? e2.message : explainDbError(e2); btn.disabled = false; btn.textContent = 'Save count'; }
      });
      preset();
  });
}

function renderCount(full){

  if (full || list.dataset.ids !== ids) {

function countedKg(row){ return r3(Math.max(0, Math.floor(+$('.c-s', row).value || 0)) * sackKgOf(row.dataset.pid) + Math.max(0, +$('.c-k', row).value || 0)); }
function paintRow(row){
  const C = S.ui.count, pid = row.dataset.pid, k = sackKgOf(pid), sys = bal(pid)[C.loc], d = r3(countedKg(row) - sys);

function countChanges(){

    .filter(x => C.rows[x.pid] && C.rows[x.pid].touched && Math.abs(x.kg - bal(x.pid)[C.loc]) >= 0.0005);

function paintBar(){

async function saveCount(){

function presetRange(p){
  const t = today();
  if (p === 'today') return [t, t];
  if (p === 'week') return [weekStart(t), t];
  if (p === 'month') return [t.slice(0,8) + '01', t];
  if (p === 'last30') return [addDays(t, -29), t];
  if (p === 'all') return ['', ''];
  return [S.ui.rep.from, S.ui.rep.to];
}
const REP_TABS = [['summary','Summary'],['inventory','Inventory & value'],['in','Stock in / Purchases'],['out','Stock out / Sales'],['transfers','Transfers']];
function mountReports(el){

    <div class="field"><label for="r-from">From</label><input type="date" id="r-from"></div>

    <div class="field"><label for="r-loc">Location</label><select id="r-loc"><option value="">Both</option><option value="bodega" ${r.loc === 'bodega' ? 'selected' : ''}>Bodega</option><option value="stall" ${r.loc === 'stall' ? 'selected' : ''}>Stall</option></select></div>
  </div>
  <div class="tabs" role="tablist">${REP_TABS.map(([k, l]) => `<button role="tab" data-rep="${k}" aria-selected="${r.tab === k}">${l}</button>`).join('')}</div>
  <div id="r-body"></div>`;
  const syncDates = () => { const [a, b] = presetRange(S.ui.rep.preset); if (S.ui.rep.preset !== 'custom') { S.ui.rep.from = a; S.ui.rep.to = b; } $('#r-from').value = S.ui.rep.from; $('#r-to').value = S.ui.rep.to; };

    R.prod = $('#r-prod').value; R.loc = $('#r-loc').value; runReport();

    const g = e.target.closest('[data-group]'); if (g) { S.ui.rep.group = g.dataset.group; runReport(); }
  });
}
let repSeq = 0, repTimer = 0;
function updateReports(){ clearTimeout(repTimer); repTimer = setTimeout(runReport, 400); }
async function runReport(){
  const body = $('#r-body'); if (!body) return;
  const R = S.ui.rep; const seq = ++repSeq;

  if (R.tab === 'inventory') { body.innerHTML = repInventory(); return; }
  if (!body.innerHTML) body.innerHTML = `<div class="loading"><p class="eyebrow">Loading…</p></div>`;
  let txns;
  try { txns = await fetchTxns(R.from, R.to); } catch(e){ body.innerHTML = `<div class="form-err">${esc(explainDbError(e))}</div>`; return; }
  if (seq !== repSeq) return;
  txns = txns.filter(t => !R.prod || t.productId === R.prod);
  body.innerHTML = R.tab === 'summary' ? repSummary(txns) : R.tab === 'in' ? repIn(txns) : R.tab === 'out' ? repOut(txns) : repTransfers(txns);
}
const locKg = (t, loc) => (t.moves || []).filter(m => !loc || m.loc === loc).reduce((a, m) => a + m.kg, 0);
function rangeLabel(){ const R = S.ui.rep; return R.from || R.to ? `${R.from ? fmtDate(R.from) : 'Start'} – ${R.to ? fmtDate(R.to) : 'today'}` : 'All time'; }
function repCard(label, val, sub){ return `<div class="kpi"><div class="k-label">${label}</div><div class="k-val" style="font-size:1.6rem">${val}</div>${sub ? `<div class="k-sub num">${sub}</div>` : ''}</div>`; }
function exportBtn(key){ return `<button class="btn sm" data-act="rep-csv" data-key="${key}">Export CSV</button>`; }
let REP_CSV = {};
function repSummary(txns){
  const R = S.ui.rep; const loc = R.loc;
  const ins = txns.filter(t => t.type === 'in' && (!loc || t.moves.some(m => m.loc === loc)));
  const outs = txns.filter(t => t.type === 'out' && (!loc || t.moves.some(m => m.loc === loc)));
  const sales = outs.filter(t => (t.reason || 'Sale') === 'Sale');
  const trs = txns.filter(t => t.type === 'transfer');
  const adj = txns.filter(t => t.type === 'adjust' && (!loc || t.moves.some(m => m.loc === loc)));
  const sum = (arr, f) => arr.reduce((a, t) => a + f(t), 0);
  const salesAmt = sum(sales, t => +t.amount || 0), salesKg = sum(sales, t => -locKg(t, loc));
  const cogs = sum(sales, t => -locKg(t, loc) * (+t.costKg || costKgOf(prod(t.productId))));
  const buyAmt = sum(ins, t => +t.amount || 0), buyKg = sum(ins, t => locKg(t, loc));
  const removedKg = sum(outs.filter(t => (t.reason || 'Sale') !== 'Sale'), t => -locKg(t, loc));
  const trKg = sum(trs.filter(t => !loc || t.from === loc || t.to === loc), t => Math.abs(t.moves[0].kg));
  // grouped
  const keyOf = d => R.group === 'month' ? d.slice(0,7) : R.group === 'week' ? weekStart(d) : d;
  const lab = k => R.group === 'month' ? parseD(k + '-01').toLocaleDateString('en-PH', {month:'long', year:'numeric'}) : R.group === 'week' ? 'Week of ' + fmtDateShort(k) : fmtDate(k);
  const G = {};
  const g = k => G[k] || (G[k] = {inKg:0, buy:0, soldKg:0, sales:0, profit:0, remKg:0, trKg:0, adjKg:0});
  txns.forEach(t => {
    const x = g(keyOf(t.date));
    if (t.type === 'in') { const kg = locKg(t, loc); if (kg) { x.inKg += kg; x.buy += +t.amount || 0; } }
    else if (t.type === 'out') { const kg = -locKg(t, loc); if (!kg) return; if ((t.reason || 'Sale') === 'Sale') { x.soldKg += kg; x.sales += +t.amount || 0; x.profit += (+t.amount || 0) - kg * (+t.costKg || costKgOf(prod(t.productId))); } else x.remKg += kg; }
    else if (t.type === 'transfer') { if (!loc || t.from === loc || t.to === loc) x.trKg += Math.abs(t.moves[0].kg); }
    else if (t.type === 'adjust') x.adjKg += locKg(t, loc);
  });
  const keys = Object.keys(G).sort().reverse();
  REP_CSV.summary = {name: `summary-${R.group}`, head: ['Period','Received kg','Purchases PHP','Sold kg','Sales PHP','Gross profit PHP','Removed kg','Transferred kg','Adjustments kg'],
    rows: keys.map(k => { const x = G[k]; return [lab(k), r3(x.inKg), r2(x.buy), r3(x.soldKg), r2(x.sales), r2(x.profit), r3(x.remKg), r3(x.trKg), r3(x.adjKg)]; })};
  return `<p class="small muted" style="margin-bottom:12px">${esc(rangeLabel())}${R.prod ? ' · ' + esc(prod(R.prod) ? prod(R.prod).name : '') : ''}${loc ? ' · ' + LOC[loc] : ''}</p>
  <section class="kpis">${repCard('Sales', peso(salesAmt), `${nf(salesKg)} kg sold · ${sales.length} sales`)}${repCard('Gross profit (est.)', peso(salesAmt - cogs), `cost of rice sold ${peso(cogs)}`)}${repCard('Purchases', peso(buyAmt), `${nf(buyKg)} kg received · ${ins.length} deliveries`)}${repCard('Transfers', nf(trKg) + ' kg', `${removedKg ? nf(removedKg) + ' kg removed (not sold) · ' : ''}${adj.length} adjustments`)}</section>

/* ---------- CSV / backup ---------- */
function toCSV(head, rows){
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
}
async function saveFile(filename, data){
  if (S.downloads) {
    try { await S.downloads.save({filename, data}); toast('Saved ' + filename); return; }
    catch(e){
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('A save is already waiting for your confirmation.', 'err'); return; }
      if (!e || !['unavailable','not_granted','capability_disabled','capability_removed','extension_not_enabled'].includes(e.code)) { toast((e && e.message) || 'Could not save the file.', 'err'); return; }
    }
  }
  openModal(`<h2>Copy your export</h2><p class="muted">Saving files is not available here. Copy the text below and paste it into a file named <b>${esc(filename)}</b>.</p><textarea id="cp-text" rows="10" readonly style="font-family:var(--f-num);font-size:.8rem">${esc(data.replace(/^﻿/, ''))}</textarea><div class="modal-actions"><button class="btn" data-act="close-modal">Close</button><button class="btn primary" id="cp-go">Copy</button></div>`, m => {
    $('#cp-go', m).addEventListener('click', () => { const ta = $('#cp-text', m); navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { ta.focus(); ta.select(); toast('Press Ctrl+C (or long-press → Copy)'); }); });
  });
}
function exportReport(key){ const r = REP_CSV[key]; if (!r) return; saveFile(`${slug(bizName())}-${r.name}-${S.ui.rep.from || 'start'}-to-${S.ui.rep.to || today()}.csv`, toCSV(r.head, r.rows)); }
function exportHistory(){
  const rows = histRows();
  saveFile(`${slug(bizName())}-inventory-history-${today()}.csv`, toCSV(['Date','Time','Product','Location','Transaction type','Quantity kg','Quantity sacks','Previous stock kg','New stock kg','User','Customer','Reference','Notes'],
    rows.map(r => { const k = sackKgOf(r.t.productId); return [r.t.date, fmtTime(r.t.at), prod(r.t.productId) ? prod(r.t.productId).name : '', LOC[r.m.loc], KIND[r.kind], r.m.kg, r2(r.m.kg / k), r.m.prev, r.m.next, userOf(r.t), r.t.customer || '', r.t.ref || '', [r.t.reason && r.t.reason !== 'Sale' ? r.t.reason : '', r.t.notes].filter(Boolean).join(' — ')]; })));
}
async function backupAll(btn){

    await saveFile(`${slug(bizName())}-all-transactions-${today()}.csv`, toCSV(['Date','Time','Product','Location','Transaction type','Quantity kg','Quantity sacks','Previous stock kg','New stock kg','Unit cost/price PHP','Amount PHP','Supplier','Customer','Reference','User','Notes'], rows));
  } catch(e){ toast(explainDbError(e), 'err'); }

async function wipe(collections, progress){
  for (const name of collections) {
    for (let guard = 0; guard < 100; guard++) {
      const snap = await withRetry(() => S.db.collection(name).limit(500).get());
      if (snap.empty) break;
      for (const d of snap.docs) { await withRetry(() => S.db.collection(name).doc(d.id).delete()); progress && progress(); }
    }
  }
}
async function restoreBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(e){ toast('That file is not a valid backup.', 'err'); return; }
  if (!data || data.app !== 'bigasan-inventory' || !Array.isArray(data.products) || !Array.isArray(data.txns)) { toast('That file is not a Bigasan Inventory backup.', 'err'); return; }
  const ok = await confirmBox('Replace all data with this backup?', `<p>The backup from <b>${esc(new Date(data.exportedAt).toLocaleString('en-PH'))}</b> has ${data.products.length} rice varieties and ${data.txns.length} transactions.</p><p>Everything currently in the app will be replaced. Download a backup of the current data first if you might need it.</p>`, 'Replace and restore', true);
  if (!ok) return;
  const total = data.products.length + (data.suppliers || []).length + (data.stock || []).length + data.txns.length + 1;
  let done = 0;
  const m = openModal(`<h2>Restoring backup…</h2><p class="muted">Keep this page open.</p><div class="progress"><span id="rs-bar"></span></div><p class="small muted" id="rs-txt"></p>`);
  const tick = () => { done++; const bar = $('#rs-bar'); if (bar) bar.style.width = Math.min(100, done / total * 100) + '%'; const tx = $('#rs-txt'); if (tx) tx.textContent = `${done} of ${total}`; };
  try {
    $('#rs-txt').textContent = 'Clearing current data…';
    await wipe(['txns','stock','products','suppliers']);
    const put = async (col, list) => { for (const d of list || []) { const id = d.id; const body = Object.assign({}, d); delete body.id; if (!id) continue; await withRetry(() => S.db.collection(col).doc(id).set(body)); tick(); } };
    await put('suppliers', data.suppliers); await put('products', data.products); await put('txns', data.txns); await put('stock', data.stock);
    await withRetry(() => S.db.doc('settings/main').set(Object.assign({}, data.settings || {}))); tick();
    closeModal(); toast('Backup restored');
  } catch(e){ closeModal(); toast(explainDbError(e) + ' The restore stopped part-way; run it again.', 'err'); }
}
async function checkStock(btn){
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Checking…';
  try {
    const txns = await fetchTxns('', ''); const calc = {};
    txns.forEach(t => (t.moves || []).forEach(m => { const c = calc[t.productId] || (calc[t.productId] = {bodega:0, stall:0}); c[m.loc] = r3(c[m.loc] + m.kg); }));
    const ids = new Set([...Object.keys(calc), ...Object.keys(S.stock)]);
    const diffs = [];
    ids.forEach(id => { const c = calc[id] || {bodega:0, stall:0}; const s = bal(id); LOCS.forEach(l => { if (Math.abs(c[l] - s[l]) > 0.001) diffs.push({id, loc:l, saved: s[l], calc: c[l]}); }); });
    const box = $('#chk-result');
    if (!diffs.length) { box.innerHTML = `<span class="pill ok">Matches</span> <span class="small muted">All ${txns.length} transactions add up to the stock shown.</span>`; return; }
    box.innerHTML = `<div class="form-err">${diffs.length} balance(s) do not match the history:<ul>${diffs.map(d => `<li>${esc(prod(d.id) ? prod(d.id).name : d.id)} at ${LOC[d.loc]}: shown ${nf(d.saved)} kg, history adds up to ${nf(d.calc)} kg</li>`).join('')}</ul></div><button class="btn primary" id="chk-fix">Set stock to match history</button>`;
    $('#chk-fix').addEventListener('click', async () => {
      try { for (const id of new Set(diffs.map(d => d.id))) { const c = calc[id] || {bodega:0, stall:0}; await withRetry(() => S.db.doc('stock/' + id).set({bodega: c.bodega, stall: c.stall, updatedAt: new Date().toISOString(), lastTxn: 'rebuild'})); } box.innerHTML = `<span class="pill ok">Fixed</span>`; toast('Stock rebuilt from history'); }
      catch(e){ toast(explainDbError(e), 'err'); }
    });
  } catch(e){ toast(explainDbError(e), 'err'); }
  finally { btn.disabled = false; btn.textContent = label; }
}
async function startFresh(){
  openModal(`<h2>Start fresh</h2><p>This deletes every transaction and sets all stock to zero. Download a backup first if you want to keep anything.</p>
    <label class="small"><input type="checkbox" id="sf-all"> Also delete all rice varieties and suppliers</label>

  $('#chk-go').addEventListener('click', e => checkStock(e.currentTarget));
  $('#fresh-go').addEventListener('click', startFresh);
  const app = window.bigasanApp || {};
  $('#acct-email').textContent = app.email || '';
  $('#acct-out').addEventListener('click', () => app.signOut && app.signOut());
  const inst = () => { const row = $('#inst-row'); if (row) row.hidden = !app.canInstall; };
  inst(); window.addEventListener('bigasan:installable', inst);
  $('#inst-go').addEventListener('click', async () => { if (await app.install()) toast('Installed. Open Bigasan from your home screen.'); });
  $('#rs-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); });
}

/* ---------- page table ---------- */
const PAGES = {
  dashboard:{mount: mountDashboard, update: updateDashboard},
  inventory:{mount: mountInventory, update: () => renderInvBody(false)},
  'stock-in':{mount: mountStockIn, update: updateStockIn},
  'stock-out':{mount: mountStockOut, update: updateStockOut},
  transfer:{mount: mountTransfer, update: updateTransfer},
  count:{mount: mountCount, update: () => renderCount(false)},
  products:{mount: mountProducts, update: updateProducts},
  suppliers:{mount: mountSuppliers, update: updateSuppliers},
  reports:{mount: mountReports, update: () => { if (S.ui.rep.tab === 'inventory') runReport(); else updateReports(); }},
  settings:{mount: mountSettings}
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    e.preventDefault();
    if (nav.dataset.prod) S.ui.pendingProd = nav.dataset.prod;
    if (nav.dataset.tab) S.ui.invTab = nav.dataset.tab;
    go(nav.dataset.nav); return;
  }
  const st = e.target.closest('[data-step]');
  if (st) {
    const inp = document.getElementById(st.dataset.for);
    if (inp) { inp.value = Math.max(0, Math.round(+inp.value || 0) + (+st.dataset.step)); inp.dispatchEvent(new Event('input', {bubbles: true})); }
    return;
  }
  const pf = e.target.closest('[data-pile-for]');
  if (pf) {
    const pre = pf.dataset.pileFor, sel = $('#' + pre + '-prod'), pid = sel && sel.value;
    if (!prod(pid)) { toast('Choose a rice variety first.', 'err'); return; }
    openPileCounter(pid, sacks => {
      const sk = document.querySelector('input[name="' + pre + '-unit"][value="sack"]');
      if (sk && !sk.checked) { sk.checked = true; sk.dispatchEvent(new Event('change', {bubbles: true})); }
      const q = $('#' + pre + '-qty'); q.value = sacks; q.dispatchEvent(new Event('input', {bubbles: true}));
    }, {noKg: true});
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'more') openSheet();
  else if (act === 'close-sheet' && e.target === a) closeSheet();
  else if (act === 'modal-back' && e.target === a) closeModal();
  else if (act === 'close-modal') closeModal();
  else if (act === 'new-product') openProduct(null);
  else if (act === 'edit-product') openProduct(a.dataset.id);
  else if (act === 'archive-product') toggleArchive(a.dataset.id);
  else if (act === 'new-supplier') openSupplier(null);
  else if (act === 'edit-supplier') openSupplier(a.dataset.id);
  else if (act === 'delete-supplier') { const id = a.dataset.id; withRetry(() => S.db.collection('suppliers').doc(id).delete()).then(() => { closeModal(); toast('Supplier deleted'); }, err => toast(explainDbError(err), 'err')); }
  else if (act === 'adjust') openAdjust(a.dataset.id);
  else if (act === 'hist-more') { S.ui.histLimit += 300; renderHistory(); }
  else if (act === 'hist-csv') exportHistory();
  else if (act === 'rep-csv') exportReport(a.dataset.key);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root-2').innerHTML) closePile(); else if ($('#modal-root').innerHTML) closeModal(); else closeSheet(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.page && PAGES[h]) go(h); });

const start = location.hash.slice(1);
if (PAGES[start]) S.page = start;
mountPage();
boot();
})();
</script>
